# Full build: needs the base ROM and the compiler, which live only in a private container image
# (see docs/ci.md). Verifies every function, links the program with the original linker,
# uploads the progress report and publishes the progress map to the `progress` branch.
name: build

# Not on pull requests: workflows from forks cannot read the private image.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # the progress map's branch
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/acww-build:main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      MWCC_ROOT: /mwccarm
      MWCC_WRAPPER: wibo
      # wibo disagrees with Windows on a few switch-heavy functions; Wine does not.
      MWCC_FALLBACK: wine
      # The image's Wine prefix; Actions points HOME at a directory Wine refuses to use.
      WINEPREFIX: /root/.wine
    steps:
      - uses: actions/checkout@v4

      # Compiled objects, keyed by every source and header; a run only recompiles what changed.
      - uses: actions/cache@v4
        with:
          path: build/adm-kr/obj
          key: obj-${{ hashFiles('src/**', 'include/**', 'libs/**') }}
          restore-keys: obj-

      - name: Prepare
        run: cp /extract/*.nds extract/

      - name: Extract
        run: python3 tools/extract.py

      - name: Verify
        run: python3 tools/verify.py --workers "$(nproc)"

      - name: Get dsd
        run: |
          mkdir -p build/tools
          python3 -c "import urllib.request as u; u.urlretrieve('https://github.com/AetiasHax/ds-decomp/releases/download/v0.12.1/dsd-linux-x86_64', 'build/tools/dsd')"
          echo "256edde804dd8e5d7bc4c0e4187f85244ee4cd1f42bb427502e01fda6af43ceb  build/tools/dsd" | sha256sum -c
          chmod +x build/tools/dsd

      - name: Link
        run: python3 tools/link.py
        env:
          LD_WRAPPER: wine

      - name: Differential check
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends gcc-multilib >/dev/null
          python3 tools/diffcheck.py

      - name: Run to the title
        run: |
          python3 tools/run.py 0 1300 --input runtime/recordings/title-start.txt             --rtc "2005-11-23 12:00:00" --hash build/adm-kr/title-start.txt | tee build/adm-kr/run.log
          grep -q "sequence sha1 $(cat runtime/recordings/title-start.sha1)" build/adm-kr/run.log

      # The matching sources compiled for 32-bit x86. Each object is keyed by its source, its
      # headers and the flags (tools/native.py), so a restored cache only recompiles what changed.
      - uses: actions/cache@v4
        with:
          path: build/adm-kr/native/linux
          key: native-linux-${{ hashFiles('src/**', 'include/**', 'runtime/native.h', 'tools/native.py', 'tools/objrewrite.py') }}
          restore-keys: native-linux-

      - name: Build the Native functions
        run: |
          apt-get install -y -qq --no-install-recommends gcc-multilib g++-multilib binutils >/dev/null
          python3 tools/native.py

      # Every function that calls nothing, as Native against its Reference on generated states:
      # each agrees, or tests/native/known.txt says why it may not.
      - name: Check the Native functions
        run: python3 tools/diffcheck.py --native

      # The same for the Clean functions, in place of their Native versions.
      - name: Check the Clean functions
        run: python3 tools/diffcheck.py --native --clean

      # Every function with a source runs as Native, following the Reference run's timing: the
      # frames must be the Reference's, and memory the same apart from words holding PC addresses.
      - name: Run to the title as Native
        run: |
          python3 tools/run.py 0 1300 --input runtime/recordings/title-start.txt --rtc "2005-11-23 12:00:00" \
            --native=all --ram-hash 100,390,500,700,1000,1299 --expect runtime/recordings/title-start.sha1 \
            > build/adm-kr/native-all.log 2>&1 || { grep -v "VALUE at\|OFF-STEP" build/adm-kr/native-all.log | tail -40; exit 1; }
          grep -v "VALUE at\|OFF-STEP" build/adm-kr/native-all.log | tail -12

      - name: Run to the title as Native with the Clean functions
        run: |
          python3 tools/run.py 0 1300 --input runtime/recordings/title-start.txt --rtc "2005-11-23 12:00:00" \
            --native=all --clean --ram-hash 100,390,500,700,1000,1299 --expect runtime/recordings/title-start.sha1 \
            > build/adm-kr/native-clean.log 2>&1 || { grep -v "VALUE at\|OFF-STEP" build/adm-kr/native-clean.log | tail -40; exit 1; }
          grep -v "VALUE at\|OFF-STEP" build/adm-kr/native-clean.log | tail -12

      - name: Upload the Native run logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-run-logs
          path: |
            build/adm-kr/runtime-linux/native-run/*.log
            build/adm-kr/native-*.log
            build/adm-kr/native/linux/left-out.txt
            build/adm-kr/native/linux/keep-reference.txt

      - name: Report
        run: python3 tools/report.py

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: adm-kr_report
          path: build/adm-kr/report.json

      # The map is drawn from this run's results and kept on its own branch (one commit, replaced
      # each time), so main holds no generated files; README.md shows it from there.
      - name: Progress map
        run: python3 tools/progress_map.py

      - name: Publish the progress map
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          command -v git >/dev/null || (apt-get install -y -qq --no-install-recommends git >/dev/null)
          mkdir -p build/progress
          cp docs/progress.svg build/progress/
          cd build/progress
          git init -q -b progress
          git add progress.svg
          git -c user.name="github-actions[bot]" -c user.email="41898283+github-actions[bot]@users.noreply.github.com"             commit -q -m "Progress map for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" progress
